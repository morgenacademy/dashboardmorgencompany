# Cockpit (index.html) op /, dashboard-SPA op /dashboard. Buildless static site.
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Wachtwoord-gate op alle routes (alleen actief als COCKPIT_PASSWORD is gezet).
[[edge_functions]]
  path = "/*"
  function = "gate"
